<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <title>Denah Rumah 3D</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
        :root {
            --bg: #f5f5f5;
            --fg: #1a1a1a;
            --btn: #fff;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, sans-serif;
            overflow: hidden
        }

        #ui {
            position: fixed;
            left: 10px;
            top: calc(10px + env(safe-area-inset-top, 0px));
            z-index: 5;
            display: flex;
            gap: 6px;
            flex-wrap: wrap
        }

        button {
            background: var(--btn);
            color: var(--fg);
            border: 1px solid #8886;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer
        }

        button.active {
            background: #0284c7;
            color: #fff;
            border-color: #0284c7
        }

        #povNav {
            position: fixed;
            left: 10px;
            bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            z-index: 5;
            display: none;
            gap: 6px;
            flex-wrap: wrap;
            max-width: calc(100vw - 20px)
        }

        #povNav button {
            font-size: 12px;
            padding: 6px 10px
        }

        canvas {
            display: block;
            touch-action: none
        }
    </style>
</head>

<body>
    <div id="ui">
        <button id="p">Perspektif</button>
        <button id="r">Hilangkan atap</button>
        <button id="k">Hilangkan rangka</button>
        <button id="m">Sembunyikan garis</button>
        <button id="v">Aktifkan POV</button>
    </div>
    <div id="povNav"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // H_LOW = 2.9 agar dari lantai Y_DROP (-0.10) tinggi bersih dindingnya tepat 3.0m
        const T = THREE, H = 3.5, H_LOW = 2.9, H_TERAS = 3.0, Y_DROP = -0.10, TH = 0.15, hT = TH / 2;
        const scene = new T.Scene();
        scene.background = new T.Color(0xf4f4f4);

        const cam = new T.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
        const ren = new T.WebGLRenderer({ antialias: true });
        ren.setSize(innerWidth, innerHeight);
        ren.setPixelRatio(Math.min(devicePixelRatio, 2));
        document.body.appendChild(ren.domElement);

        scene.add(new T.HemisphereLight(0xffffff, 0x787878, 0.72));
        const sun = new T.DirectionalLight(0xffffff, 0.55);
        sun.position.set(-12, 22, 18);
        scene.add(sun);
        const fillLight = new T.DirectionalLight(0xeef6ff, 0.24);
        fillLight.position.set(14, 15, -16);
        scene.add(fillLight);

        function createTileTexture() {
            const cv = document.createElement('canvas');
            cv.width = 512;
            cv.height = 512;
            const g = cv.getContext('2d');

            g.fillStyle = '#9c958b';
            g.fillRect(0, 0, 512, 512);

            const grout = 4;
            const tiles = [
                [0, 0, '#e3ded6'],
                [256, 0, '#dfd9d0'],
                [0, 256, '#dfd9d0'],
                [256, 256, '#e3ded6']
            ];
            for (const [tx, ty, col] of tiles) {
                g.fillStyle = col;
                g.fillRect(tx + grout / 2, ty + grout / 2, 256 - grout, 256 - grout);
            }

            const tex = new T.CanvasTexture(cv);
            tex.wrapS = T.RepeatWrapping;
            tex.wrapT = T.RepeatWrapping;
            tex.anisotropy = 8;
            return tex;
        }

        function createAsbesMaterials() {
            const w = 512, h = 512;
            const cv = document.createElement('canvas');
            cv.width = w;
            cv.height = h;
            const g = cv.getContext('2d');

            const bcv = document.createElement('canvas');
            bcv.width = w;
            bcv.height = h;
            const bg = bcv.getContext('2d');

            g.fillStyle = '#7e848c';
            g.fillRect(0, 0, w, h);

            bg.fillStyle = '#808080';
            bg.fillRect(0, 0, w, h);

            let seed = 42;
            const rand = () => {
                seed = (seed * 1664525 + 1013904223) % 4294967296;
                return seed / 4294967296;
            };

            for (let i = 0; i < 6500; i++) {
                const x = rand() * w;
                const y = rand() * h;
                const r = 0.6 + rand() * 1.8;
                const light = rand() > 0.48;
                g.fillStyle = light ? 'rgba(175, 182, 190, 0.14)' : 'rgba(55, 62, 70, 0.16)';
                g.fillRect(x, y, r, r * (1 + rand() * 2.2));

                bg.fillStyle = light ? 'rgba(195, 195, 195, 0.18)' : 'rgba(65, 65, 65, 0.18)';
                bg.fillRect(x, y, r, r * 1.5);
            }

            for (let i = 0; i < 220; i++) {
                const x = rand() * w;
                const y = rand() * h;
                const len = 18 + rand() * 55;
                g.fillStyle = rand() > 0.5 ? 'rgba(68, 75, 84, 0.10)' : 'rgba(165, 172, 180, 0.08)';
                g.fillRect(x, y, 1.5, len);
            }

            const lapGrad = g.createLinearGradient(0, 0, 0, 14);
            lapGrad.addColorStop(0, 'rgba(30, 35, 42, 0.52)');
            lapGrad.addColorStop(0.35, 'rgba(55, 62, 70, 0.22)');
            lapGrad.addColorStop(1, 'rgba(126, 132, 140, 0)');
            g.fillStyle = lapGrad;
            g.fillRect(0, 0, w, 14);

            g.fillStyle = 'rgba(185, 192, 200, 0.28)';
            g.fillRect(0, h - 3, w, 3);

            bg.fillStyle = '#303030';
            bg.fillRect(0, 0, w, 5);
            bg.fillStyle = '#c8c8c8';
            bg.fillRect(0, h - 4, w, 4);

            g.fillStyle = 'rgba(42, 48, 56, 0.36)';
            g.fillRect(0, 0, 4, h);
            g.fillStyle = 'rgba(180, 187, 195, 0.24)';
            g.fillRect(w - 3, 0, 3, h);

            bg.fillStyle = '#3c3c3c';
            bg.fillRect(0, 0, 4, h);

            g.fillStyle = 'rgba(50, 56, 64, 0.55)';
            for (let px = 32; px < w; px += 96) {
                g.beginPath();
                g.arc(px, 16, 2.6, 0, Math.PI * 2);
                g.fill();
            }

            const map = new T.CanvasTexture(cv);
            map.wrapS = T.RepeatWrapping;
            map.wrapT = T.RepeatWrapping;
            map.anisotropy = 8;

            const bumpMap = new T.CanvasTexture(bcv);
            bumpMap.wrapS = T.RepeatWrapping;
            bumpMap.wrapT = T.RepeatWrapping;
            bumpMap.anisotropy = 8;

            const sheetMat = new T.MeshLambertMaterial({
                map,
                bumpMap,
                bumpScale: 0.008,
                side: T.DoubleSide
            });

            const ridgeMat = new T.MeshLambertMaterial({
                color: 0x737981,
                bumpMap,
                bumpScale: 0.006,
                side: T.DoubleSide
            });

            return { sheetMat, ridgeMat };
        }

        function createWoodTexture() {
            const cv = document.createElement('canvas');
            cv.width = 256;
            cv.height = 256;
            const g = cv.getContext('2d');

            g.fillStyle = '#9a6134';
            g.fillRect(0, 0, 256, 256);

            let seed = 108;
            const rand = () => {
                seed = (seed * 1664525 + 1013904223) % 4294967296;
                return seed / 4294967296;
            };

            for (let y = 0; y < 256; y += 2) {
                const dark = rand() > 0.45;
                g.fillStyle = dark ? 'rgba(92, 52, 22, 0.22)' : 'rgba(182, 125, 76, 0.16)';
                g.fillRect(0, y, 256, 1 + rand() * 1.5);
            }

            const tex = new T.CanvasTexture(cv);
            tex.wrapS = T.RepeatWrapping;
            tex.wrapT = T.RepeatWrapping;
            tex.anisotropy = 4;
            return tex;
        }

        const tileTex = createTileTexture();
        const woodTex = createWoodTexture();
        const { sheetMat: asbesM, ridgeMat: asbesRidgeM } = createAsbesMaterials();

        const wallM = new T.MeshLambertMaterial({ color: 0xf5f5f3 });
        const slabM = new T.MeshLambertMaterial({ map: tileTex });
        const slabSideM = new T.MeshLambertMaterial({ color: 0xf5f5f3 });
        const timberMainM = new T.MeshLambertMaterial({ map: woodTex, color: 0xb67b48 });
        const timberPurlinM = new T.MeshLambertMaterial({ map: woodTex, color: 0x9c6234 });
        const woodEdgeM = new T.LineBasicMaterial({ color: 0x4b2a12 });
        const doorM = new T.MeshLambertMaterial({ color: 0x7a441e });
        const frameM = new T.MeshLambertMaterial({ color: 0x5c3012 });
        const aluFrameM = new T.MeshLambertMaterial({ color: 0x9ca3af });
        const aluDoorM = new T.MeshLambertMaterial({ color: 0xb6bec8 });
        const winSashM = new T.MeshLambertMaterial({ color: 0x854d27 });
        const winHardwareM = new T.MeshLambertMaterial({ color: 0x9ca3af });
        const winM = new T.MeshLambertMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.42, side: T.DoubleSide });
        const edgeM = new T.LineBasicMaterial({ color: 0x22262a });
        const cornerM = new T.LineBasicMaterial({ color: 0x9c9890 });

        function box(x0, y0, z0, x1, y1, z1, m, edge, target = scene, eMat = edgeM) {
            const b = new T.Mesh(new T.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), m);
            b.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
            target.add(b);
            if (edge) {
                const l = new T.LineSegments(new T.EdgesGeometry(b.geometry), eMat);
                l.position.copy(b.position);
                target.add(l);
            }
            return b;
        }

        function woodBeam(p0, p1, w, h, mat = timberMainM, target = timberFrame, upHint = null) {
            const v0 = new T.Vector3(p0[0], p0[1], p0[2]);
            const v1 = new T.Vector3(p1[0], p1[1], p1[2]);
            const dir = new T.Vector3().subVectors(v1, v0);
            const len = dir.length();
            if (len < 0.005) return;

            const geo = new T.BoxGeometry(w, h, len);
            const mesh = new T.Mesh(geo, mat);
            mesh.position.addVectors(v0, v1).multiplyScalar(0.5);

            const zAxis = dir.clone().normalize();
            let up = upHint ? new T.Vector3(upHint[0], upHint[1], upHint[2]).normalize() : new T.Vector3(0, 1, 0);
            if (Math.abs(zAxis.dot(up)) > 0.98) {
                up = new T.Vector3(1, 0, 0);
            }
            const xAxis = new T.Vector3().crossVectors(up, zAxis).normalize();
            const yAxis = new T.Vector3().crossVectors(zAxis, xAxis).normalize();
            const basis = new T.Matrix4().makeBasis(xAxis, yAxis, zAxis);
            mesh.quaternion.setFromRotationMatrix(basis);

            target.add(mesh);

            const edge = new T.LineSegments(new T.EdgesGeometry(geo), woodEdgeM);
            edge.position.copy(mesh.position);
            edge.quaternion.copy(mesh.quaternion);
            target.add(edge);
        }

        function floorSlab(x0, y0, z0, x1, y1, z1) {
            const baseGeo = new T.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
            const geo = baseGeo.toNonIndexed();
            const pos = geo.attributes.position;
            const norm = geo.attributes.normal;
            const uv = geo.attributes.uv;
            const cx = (x0 + x1) / 2;
            const cz = (z0 + z1) / 2;
            const TILE_MODULE = 1.20;

            for (let i = 0; i < pos.count; i++) {
                const wx = cx + pos.getX(i);
                const wz = cz + pos.getZ(i);
                if (norm.getY(i) > 0.5) {
                    uv.setXY(i, wx / TILE_MODULE, wz / TILE_MODULE);
                } else {
                    uv.setXY(i, 0, 0);
                }
            }
            uv.needsUpdate = true;

            geo.clearGroups();
            geo.addGroup(0, 12, 1);
            geo.addGroup(12, 6, 0);
            geo.addGroup(18, 18, 1);

            const mesh = new T.Mesh(geo, [slabM, slabSideM]);
            mesh.position.set(cx, (y0 + y1) / 2, cz);
            scene.add(mesh);
        }

        function cornerLine(x, z, y0 = 0, y1 = H) {
            const geo = new T.BufferGeometry().setFromPoints([
                new T.Vector3(x, y0, z),
                new T.Vector3(x, y1, z)
            ]);
            scene.add(new T.Line(geo, cornerM));
        }

        function segLine(x0, y0, z0, x1, y1, z1) {
            const geo = new T.BufferGeometry().setFromPoints([
                new T.Vector3(x0, y0, z0),
                new T.Vector3(x1, y1, z1)
            ]);
            scene.add(new T.Line(geo, cornerM));
        }

        // =========================================================================
        // VENTILASI / BOVEN KAYU KISI-KISI HORIZONTAL
        // =========================================================================
        const VENT_GAP = 0.10;
        const VENT_H = 0.25;

        function addVentilation(x1, z1, x2, z2, yBot, yTop) {
            const hz = Math.abs(z1 - z2) < 1e-6;
            const a0 = hz ? Math.min(x1, x2) : Math.min(z1, z2);
            const a1 = hz ? Math.max(x1, x2) : Math.max(z1, z2);
            const c = hz ? z1 : x1;
            const span = a1 - a0;
            const dHalf = hT + 0.001;
            const fT = 0.032;
            const innerH = (yTop - yBot) - fT * 2;
            const slats = 4;
            const slatThick = 0.016;
            const slatDepth = 0.055;

            let posts = [];
            if (span <= 0.55) {
                posts = [a0 + span * 0.50];
            } else if (span <= 0.85) {
                posts = [a0 + span * 0.34, a0 + span * 0.66];
            } else {
                posts = [a0 + span * 0.22, a0 + span * 0.50, a0 + span * 0.78];
            }

            if (hz) {
                box(a0, yBot, c - dHalf, a1, yBot + fT, c + dHalf, frameM, 1);
                box(a0, yTop - fT, c - dHalf, a1, yTop, c + dHalf, frameM, 1);
                box(a0, yBot + fT, c - dHalf, a0 + fT, yTop - fT, c + dHalf, frameM, 1);
                box(a1 - fT, yBot + fT, c - dHalf, a1, yTop - fT, c + dHalf, frameM, 1);

                for (const px of posts) {
                    box(px - 0.015, yBot + fT, c - dHalf + 0.008, px + 0.015, yTop - fT, c + dHalf - 0.008, frameM, 1);
                }

                const stepY = innerH / (slats + 1);
                for (let i = 1; i <= slats; i++) {
                    const sy = yBot + fT + i * stepY;
                    box(a0 + fT, sy - slatThick / 2, c - slatDepth / 2, a1 - fT, sy + slatThick / 2, c + slatDepth / 2, frameM, 1);
                }
            } else {
                box(c - dHalf, yBot, a0, c + dHalf, yBot + fT, a1, frameM, 1);
                box(c - dHalf, yTop - fT, a0, c + dHalf, yTop, a1, frameM, 1);
                box(c - dHalf, yBot + fT, a0, c + dHalf, yTop - fT, a0 + fT, frameM, 1);
                box(c - dHalf, yBot + fT, a1 - fT, c + dHalf, yTop - fT, a1, frameM, 1);

                for (const pz of posts) {
                    box(c - dHalf + 0.008, yBot + fT, pz - 0.015, c + dHalf - 0.008, yTop - fT, pz + 0.015, frameM, 1);
                }

                const stepY = innerH / (slats + 1);
                for (let i = 1; i <= slats; i++) {
                    const sy = yBot + fT + i * stepY;
                    box(c - slatDepth / 2, sy - slatThick / 2, a0 + fT, c + slatDepth / 2, sy + slatThick / 2, a1 - fT, frameM, 1);
                }
            }
        }

        // =========================================================================
        // JENDELA JUNGKIT KAYU + VENTILASI ATAS (JARAK 10CM)
        // =========================================================================
        function addAwningWindow(hz, s, e, c, yBot, yTop, outDir = 1) {
            const w = e - s;
            const h = yTop - yBot;
            const centerPos = (s + e) / 2;

            const grp = new T.Group();
            if (hz) {
                grp.position.set(centerPos, yBot, c);
                if (outDir < 0) grp.rotation.y = Math.PI;
            } else {
                grp.position.set(c, yBot, centerPos);
                grp.rotation.y = outDir > 0 ? Math.PI / 2 : -Math.PI / 2;
            }
            scene.add(grp);

            const halfW = w / 2;
            const jambT = 0.038;
            const depthHalf = hT + 0.001;

            box(-halfW, h - jambT, -depthHalf, halfW, h, depthHalf, frameM, 1, grp);
            box(-halfW, 0, -depthHalf, halfW, jambT, depthHalf, frameM, 1, grp);
            box(-halfW, jambT, -depthHalf, -halfW + jambT, h - jambT, depthHalf, frameM, 1, grp);
            box(halfW - jambT, jambT, -depthHalf, halfW, h - jambT, depthHalf, frameM, 1, grp);

            box(-0.07, jambT, 0.005, 0.07, jambT + 0.022, 0.045, winHardwareM, 1, grp);

            const sashW = w - jambT * 2 - 0.008;
            const sashH = h - jambT * 2 - 0.008;
            const sashStile = 0.048;
            const sashThick = 0.036;

            const pivot = new T.Group();
            pivot.position.set(0, h - jambT - 0.004, 0.015);
            pivot.rotation.x = -0.30;
            grp.add(pivot);

            const sHalfW = sashW / 2;
            const sz0 = -sashThick / 2;
            const sz1 = sashThick / 2;

            box(-sHalfW, -sashStile, sz0, sHalfW, 0, sz1, winSashM, 1, pivot);
            box(-sHalfW, -sashH, sz0, sHalfW, -sashH + sashStile, sz1, winSashM, 1, pivot);
            box(-sHalfW, -sashH + sashStile, sz0, -sHalfW + sashStile, -sashStile, sz1, winSashM, 1, pivot);
            box(sHalfW - sashStile, -sashH + sashStile, sz0, sHalfW, -sashStile, sz1, winSashM, 1, pivot);

            const glassW = sashW - sashStile * 2;
            const glassH = sashH - sashStile * 2;
            const glassMesh = new T.Mesh(new T.PlaneGeometry(glassW, glassH), winM);
            glassMesh.position.set(0, -sashH / 2, 0);
            pivot.add(glassMesh);

            [-sHalfW + 0.01, sHalfW - 0.01].forEach(lx => {
                segLine(
                    (hz ? centerPos + lx : c),
                    yBot + jambT + 0.01,
                    (hz ? c + 0.02 : centerPos + lx),
                    (hz ? centerPos + lx : c + outDir * 0.24),
                    yBot + jambT + 0.04,
                    (hz ? c + outDir * 0.24 : centerPos + lx)
                );
            });

            const ventY0 = yTop + VENT_GAP;
            const ventY1 = ventY0 + VENT_H;
            if (hz) {
                addVentilation(s, c, e, c, ventY0, ventY1);
            } else {
                addVentilation(c, s, c, e, ventY0, ventY1);
            }
        }

        function W(x1, z1, x2, z2, ops = [], h = H, y0 = 0, isBeam = false, winOutDir = 1) {
            const hz = Math.abs(z1 - z2) < 1e-6;
            const a0 = hz ? Math.min(x1, x2) : Math.min(z1, z2);
            const a1 = hz ? Math.max(x1, x2) : Math.max(z1, z2);
            const c = hz ? z1 : x1;
            const B = (s, e, b, t, m) => {
                if (e - s < 0.01) return;
                hz ? box(s - hT, b, c - hT, e + hT, t, c + hT, m, 0)
                    : box(c - hT, b, s - hT, c + hT, t, e + hT, m, 0);
            };
            ops = ops.map(o => [
                Math.min(o[0], o[1]),
                Math.max(o[0], o[1]),
                o[2] !== undefined ? o[2] : 0.72,
                o[3] !== undefined ? o[3] : 2.08
            ]).sort((a, b) => a[0] - b[0]);

            let p = a0;
            for (const [s, e, wY0, wY1] of ops) {
                const winVentY0 = wY1 + VENT_GAP;
                const winVentY1 = winVentY0 + VENT_H;

                B(p, s - hT, y0, h, wallM);
                B(s + hT, e - hT, y0, wY0, wallM);
                B(s + hT, e - hT, wY1, winVentY0, wallM);
                B(s + hT, e - hT, winVentY1, h, wallM);
                addAwningWindow(hz, s, e, c, wY0, wY1, winOutDir);
                p = e + hT;
            }
            B(p, a1, y0, h, wallM);
        }

        // =========================================================================
        // FUNGSI GAWANG PINTU (KAYU & ALUMINIUM) + DAUN PINTU + VENTILASI ATAS
        // =========================================================================
        const DOOR_CLEAR_W = 0.80;
        const DOOR_CLEAR_H = 2.00;
        const JAMB_T = 0.06;
        const DOOR_OPEN_SPAN = DOOR_CLEAR_W + JAMB_T * 2;

        const BATH_DOOR_CLEAR_W = 0.70;
        const BATH_DOOR_CLEAR_H = 1.90;
        const BATH_JAMB_T = 0.045;
        const BATH_OPEN_SPAN = BATH_DOOR_CLEAR_W + BATH_JAMB_T * 2;

        const RELAX_DOOR_Z0 = 3.0 + hT;
        const RELAX_DOOR_Z1 = RELAX_DOOR_Z0 + DOOR_OPEN_SPAN;
        const FRONT_DOOR_X0 = 6.25 + hT;
        const FRONT_DOOR_X1 = FRONT_DOOR_X0 + DOOR_OPEN_SPAN;

        function addDoorFrame(x1, z1, x2, z2, baseY = 0, opts = {}) {
            const hz = Math.abs(z1 - z2) < 1e-6;
            const clearH = opts.clearH || DOOR_CLEAR_H;
            const jT = opts.jambT || JAMB_T;
            const fMat = opts.frameMat || frameM;
            const hasVent = opts.hasVent !== undefined ? opts.hasVent : true;

            const yTopClear = baseY + clearH;
            const yTopOuter = yTopClear + jT;
            const dHalf = hT + 0.0015;

            const a0 = hz ? Math.min(x1, x2) : Math.min(z1, z2);
            const a1 = hz ? Math.max(x1, x2) : Math.max(z1, z2);
            const c = hz ? z1 : x1;

            if (hz) {
                box(a0, baseY, c - dHalf, a0 + jT, yTopClear, c + dHalf, fMat, 1);
                box(a1 - jT, baseY, c - dHalf, a1, yTopClear, c + dHalf, fMat, 1);
                box(a0, yTopClear, c - dHalf, a1, yTopOuter, c + dHalf, fMat, 1);
            } else {

            }

            if (hasVent) {
                const ventY0 = yTopOuter + VENT_GAP;

        function D(hx, hz, w, deg, baseY = 0, opts = {}) {
            const rad = deg * Math.PI / 180;

                box(halfW - frameW, -halfH, -zOff, halfW, halfH, zOff, aluFrameM, 1, grp);

                box(-halfW + frameW, -halfH, -zOff, halfW - frameW, -halfH + frameW, zOff, aluFrameM, 1, grp);
                box(-halfW + frameW, -0.05, -zOff, halfW - frameW, 0.02, zOff, aluFrameM, 1, grp);

        }

        // =========================================================================
        // 1. PONDASI & PELAT LANTAI
        // =========================================================================
        floorSlab(-hT, -0.35, -hT, 11.0 + hT, Y_DROP, 3.0 + hT);

        floorSlab(6.25, -0.35, 3.0, 9.5 + hT - 0.002, 0, 9.7 + hT - 0.002);

        floorSlab(3.0 - hT, -0.35, RELAX_DOOR_Z0, 3.0, 0, RELAX_DOOR_Z1);

        // =========================================================================

        W(0, 3.0, 1.84 - hT, 3.0, [], H_WING_FRONT, Y_DROP);

        W(3.0, 3.0, 9.5, 3.0, [], H, Y_DROP);

        W(9.5, 0, 11.0, 0, [], H_WING_BACK, Y_DROP);
        W(11.0, 0, 11.0, 3.0, [], H_WING_BACK, Y_DROP);
        W(9.5, 3.0, 9.74 - hT, 3.0, [], H_WING_FRONT, Y_DROP);
        W(10.66 + hT, 3.0, 11.0, 3.0, [], H_WING_FRONT, Y_DROP);

        W(8.0, 1.5, 9.5, 1.5, [], H, Y_DROP);
        W(9.5, 1.5, 11.0, 1.5, [], H_LOW, Y_DROP);

        const BATH_DOOR_Z0 = hT;
        const BATH_DOOR_Z1 = BATH_DOOR_Z0 + BATH_OPEN_SPAN;
        W(8.0, BATH_DOOR_Z1 + hT, 8.0, 1.5 - hT, [], H, Y_DROP);

        // =========================================================================
        // 3. DINDING BANGUNAN UTAMA & JENDELA
        // =========================================================================
        W(3.0, RELAX_DOOR_Z1 + hT, 3.0, 10.2, [[4.95, 5.45, 0.88, 2.08], [5.65, 6.15, 0.88, 2.08]], H, Y_DROP, false, -1);
        W(9.5, 3.0, 9.5, 9.7, [[3.90, 4.40, 0.88, 2.08], [4.60, 5.10, 0.88, 2.08]], H, Y_DROP, false, 1);

            [3.0 + hT, 3.0 + hT, 0, H], [6.25 - hT, 3.0 + hT, 0, H], [3.0 + hT, 7.2 - hT, 0, H], [6.25 - hT, 7.2 - hT, 0, H],

            [6.25 + hT, 6.0 + hT, 0, H], [9.5 - hT, 6.0 + hT, 0, H], [6.25 + hT, 9.7 - hT, 0, H], [9.5 - hT, 9.7 - hT, 0, H],

            [3.0 - hT, 10.2 + hT, Y_DROP, H], [6.25 + hT, 10.2 + hT, Y_DROP, H], [6.25 + hT, 9.7 + hT, Y_DROP, H], [9.5 + hT, 9.7 + hT, Y_DROP, H]
        ].forEach(([cx, cz, botY, topY]) => cornerLine(cx, cz, botY, topY));

        // =========================================================================
        // 5. TIANG & BALOK COR TERAS DEPAN
        // =========================================================================
        [3.0 - hT, 6.125, 9.5 + hT - 0.25].forEach((x) => {
            box(x, Y_DROP, 11.95, x + 0.25, H_TERAS, 12.2, wallM, 0);

            cornerLine(x + 0.25, 11.95, Y_DROP, H_TERAS);
            cornerLine(x, 12.2, Y_DROP, H_TERAS);
            cornerLine(x + 0.25, 12.2, Y_DROP, H_TERAS);
        });

        const TERAS_BEAM_H = 0.22;
        const TERAS_BEAM_Z1 = 12.2;
        const TERAS_BEAM_Z0 = TERAS_BEAM_Z1 - TH;
        box(3.0 - hT + 0.0002, H_TERAS - TERAS_BEAM_H, TERAS_BEAM_Z0 + 0.0002, 9.5 + hT - 0.0002, H_TERAS - 0.0002, TERAS_BEAM_Z1 - 0.0002, wallM, 0);

        [
            [3.0 - hT + TH, 6.25 - hT],
            [6.25 + hT, 9.5 + hT - TH]
        ].forEach(([bx0, bx1]) => {

            segLine(bx0, H_TERAS - TERAS_BEAM_H, TERAS_BEAM_Z1, bx1, H_TERAS - TERAS_BEAM_H, TERAS_BEAM_Z1);
        });

        function addSlopedTerasBeam(xStart, z0, z1 = 12.2, w = TH, h = TERAS_BEAM_H) {
            const slope = 0.46 / 2.9;
            const yTop0 = H_TERAS + (z1 - z0) * slope;
            const yTop1 = H_TERAS;
            const yBot0 = yTop0 - h;
            const yBot1 = yTop1 - h;

            const s = new T.Shape();
            s.moveTo(-z0, yBot0);
            s.lineTo(-z1, yBot1);
            s.lineTo(-z1, yTop1);
            s.lineTo(-z0, yTop0);
            s.closePath();

            const geo = new T.ExtrudeGeometry(s, {
                depth: w - 0.0006,
                bevelEnabled: false
            });
            const mesh = new T.Mesh(geo, wallM);
            mesh.rotation.y = Math.PI / 2;
            mesh.position.set(xStart + 0.0003, 0, 0);
            scene.add(mesh);

            const x0 = xStart, x1 = xStart + w;
            segLine(x0, yTop0, z0, x0, yTop1, z1);
            segLine(x1, yTop0, z0, x1, yTop1, z1);
            segLine(x0, yBot0, z0, x0, yBot1, z1);
            segLine(x1, yBot0, z0, x1, yBot1, z1);
        }

        addSlopedTerasBeam(3.0 - hT, 10.2, 12.2);
        addSlopedTerasBeam(6.25 - hT, 10.2, 12.2);
        addSlopedTerasBeam(9.5 + hT - TH, 9.7, 12.2);

        // =========================================================================
        // 5B. DINDING GUNUNGAN / GEWEL PADA DINDING LUAR (TANPA GUNUNGAN TENGAH)
        // =========================================================================
        (function buildWallGables() {
            const z0 = 0.0, z1 = 10.2, rh = 1.9, ov = 0.4;
            const zMid = (z0 + z1) / 2;
            const halfWallZ = z1 - zMid;
            const halfRoofZ = halfWallZ + ov;
            const slopeRatio = rh / halfRoofZ;

            const clearance = 0.045;
            const peakOffset = rh - clearance;
            const edgeOffset = Math.max(0.01, peakOffset - halfWallZ * slopeRatio);

            const gShape = new T.Shape();
            gShape.moveTo(-halfWallZ, 0);
            gShape.lineTo(halfWallZ, 0);
            gShape.lineTo(halfWallZ, edgeOffset);
            gShape.lineTo(0, peakOffset);
            gShape.lineTo(-halfWallZ, edgeOffset);
            gShape.closePath();

            const gGeo = new T.ExtrudeGeometry(gShape, {
                depth: TH - 0.0004,
                bevelEnabled: false
            });

            [3.0, 9.5].forEach(wx => {
                const gMesh = new T.Mesh(gGeo, wallM);
                gMesh.rotation.y = Math.PI / 2;
                gMesh.position.set(wx - hT + 0.0002, H - 0.001, zMid);
                scene.add(gMesh);

                const xL = wx - hT, xR = wx + hT;
                const yPeak = H + peakOffset;
                const yEdge = H + edgeOffset;
                [xL, xR].forEach(xEdge => {
                    segLine(xEdge, H, z0, xEdge, yEdge, z0);
                    segLine(xEdge, H, z1, xEdge, yEdge, z1);
                    segLine(xEdge, yEdge, z0, xEdge, yPeak, zMid);
                    segLine(xEdge, yPeak, zMid, xEdge, yEdge, z1);

            const wShape = new T.Shape();
            wShape.moveTo(0, 0);
            wShape.lineTo(-3.0, 0);
            wShape.lineTo(-3.0, Math.max(0.01, yFrontOffset));
            wShape.closePath();

            const wGeo = new T.ExtrudeGeometry(wShape, {
                depth: TH - 0.0004,
                bevelEnabled: false
            });

            [0.0, 11.0].forEach(wx => {
                const wMesh = new T.Mesh(wGeo, wallM);
                wMesh.rotation.y = Math.PI / 2;
                wMesh.position.set(wx - hT + 0.0002, H_WING_BACK - 0.001, 0);

                const xL = wx - hT, xR = wx + hT;

                const yF = H_WING_BACK + Math.max(0.01, yFrontOffset);
                [xL, xR].forEach(xEdge => {

                    segLine(xEdge, yB, 0, xEdge, yF, 3.0);

        // =========================================================================
        // 6. GAWANG PINTU, DAUN PINTU & VENTILASI KAYU ATAS
        // =========================================================================
        addDoorFrame(1.84, 3.0, 2.76, 3.0, Y_DROP);
        D(2.70, 3.0, DOOR_CLEAR_W, -150, Y_DROP);

        });

        });

        D(6.25, MAIN_BED_DOOR_Z1 - JAMB_T, DOOR_CLEAR_W, -25, 0);

        addDoorFrame(FRONT_DOOR_X0, 9.7, FRONT_DOOR_X1, 9.7, 0);

        // 7. RANGKA ATAP KAYU DETAIL & SIMETRIS (PRESISI DI BAWAH LEMBARAN ASBES)
        // =========================================================================
        const timberFrame = new T.Group();
        scene.add(timberFrame);

        (function buildTimberRoofStructure() {
            // 7.1 Atap Pelana Utama (lembaran gelombang berada di antara yBase-0.025 s/d yBase+0.025)
            const x0 = 3.0, x1 = 9.5, z0 = 0.0, z1 = 10.2, rh = 1.9, ov = 0.4;
            const zMid = (z0 + z1) / 2; // 5.10m
            const halfSpan = z1 - zMid; // 5.10m
            const halfRoofZ = halfSpan + ov; // 5.50m
            const slope = rh / halfRoofZ; // 1.9 / 5.5 (~0.34545)
            const cosMain = 1 / Math.hypot(1, slope); // ~0.9452
            const yApex = H + rh; // 5.40m

            // Jarak bersih di bawah gelombang asbes agar gording & usuk tidak pernah menembus lembah gelombang
            const sheetBottomClear = 0.032 / cosMain; // ~0.034m vertikal
            const purlinH = 0.08;
            const purlinCenterDrop = sheetBottomClear + (purlinH * 0.5) / cosMain; // ~0.076m vertikal

            const trussXs = [4.625, 6.25, 7.875];
            const tieY = H + 0.05;
            // Kaki kuda-kuda berada tepat di bawah gording (tidak menembus gording maupun asbes)
            const rafterH = 0.11;
            const rafterCenterDrop = sheetBottomClear + (purlinH + rafterH * 0.5) / cosMain; // ~0.172m vertikal
            const yRafterPeak = yApex - rafterCenterDrop;
            const yRafterOverhang = H - rafterCenterDrop;

            for (const tx of trussXs) {
                woodBeam([tx, tieY, z0 - hT], [tx, tieY, z1 + hT], 0.08, 0.10, timberMainM);
                woodBeam([tx, tieY + 0.05, zMid], [tx, yRafterPeak - 0.04, zMid], 0.10, 0.10, timberMainM, timberFrame, [0, 0, 1]);

                woodBeam(
                    [tx, yRafterPeak, zMid],
                    [tx, yRafterOverhang, z0 - ov],
                    0.08, rafterH, timberMainM
                );
                woodBeam(
                    [tx, yRafterPeak, zMid],
                    [tx, yRafterOverhang, z1 + ov],
                    0.08, rafterH, timberMainM
                );

                const strutZOff = 2.45;
                const strutTopY = yRafterPeak - strutZOff * slope - 0.02;
                woodBeam(
                    [tx, tieY + 0.05, zMid - 0.05],
                    [tx, strutTopY, zMid - strutZOff],
                    0.07, 0.09, timberMainM
                );
                woodBeam(
                    [tx, tieY + 0.05, zMid + 0.05],
                    [tx, strutTopY, zMid + strutZOff],
                    0.07, 0.09, timberMainM
                );

                const collarZ = 1.75;
                const collarY = yRafterPeak - collarZ * slope - 0.05;
                woodBeam(
                    [tx, collarY, zMid - collarZ],
                    [tx, collarY, zMid + collarZ],
                    0.07, 0.09, timberMainM
                );
            }

            // Balok nok (ridge beam) tepat di bawah puncak pertemuan atap
            woodBeam([x0 - ov, yApex - sheetBottomClear - 0.065, zMid], [x1 + ov, yApex - sheetBottomClear - 0.065, zMid], 0.08, 0.12, timberPurlinM);

            // Gording atap utama (berada tepat di bawah lembah gelombang asbes)
            const purlinOffsets = [1.10, 2.20, 3.30, 4.40, 5.42];
            for (const dzOff of purlinOffsets) {
                const py = yApex - dzOff * slope - purlinCenterDrop;
                woodBeam([x0 - ov, py, zMid - dzOff], [x1 + ov, py, zMid - dzOff], 0.06, purlinH, timberPurlinM);
                woodBeam([x0 - ov, py, zMid + dzOff], [x1 + ov, py, zMid + dzOff], 0.06, purlinH, timberPurlinM);
            }

            // 7.2 Atap Sayap Kiri & Sayap Kanan (kasau ditumpangkan langsung ke atas tembok depan & belakang)
            const cosWing = COS_WING;
            const wingSheetClear = WING_SHEET_CLEAR;
            const wingPurlinH = WING_PURLIN_H;
            const wingPurlinDrop = wingSheetClear + (wingPurlinH * 0.5) / cosWing; // ~0.066m
            const wingRafterH = WING_RAFTER_H;
            const wingRafterDrop = WING_RAFTER_DROP; // ~0.140m

            function buildWingTimber(roofX0, roofX1, baseH, rafterXs) {
                const yStart = baseH + 1.32 - wingRafterDrop;
                const yEnd = baseH - wingRafterDrop;
                for (const rx of rafterXs) {
                    woodBeam([rx, yStart, 3.4], [rx, yEnd, -0.4], 0.055, wingRafterH, timberMainM);
                }

                const zPurlins = [3.32, 2.40, 1.48, 0.56, -0.32];
                for (const pz of zPurlins) {
                    const frac = (3.4 - pz) / 3.8;
                    const py = (baseH + 1.32 * (1 - frac)) - wingPurlinDrop;
                    woodBeam([roofX0, py, pz], [roofX1, py, pz], 0.05, wingPurlinH, timberPurlinM);
                }
            }
            buildWingTimber(-0.4, 3.0 - hT, H_LOW, [0.75, 1.50, 2.25]);
            buildWingTimber(9.5 + hT, 11.4, H_LOW, [10.0, 10.5]);

            // 7.3 Kanopi Teras Depan (kasau ditumpangkan langsung ke tembok depan tanpa balok ditanam)
            const cX0 = 3.0 - ov, cX1 = 9.5 + ov;
            const cZStart = 9.7, cZEnd = 12.6;
            const cYStart = 3.44, cYEnd = 2.98;
            const cSlope = (cYStart - cYEnd) / (cZEnd - cZStart); // 0.46 / 2.9 (~0.1586)
            const cosCanopy = 1 / Math.hypot(1, cSlope);
            const canopySheetClear = 0.032 / cosCanopy;
            const canopyPurlinH = 0.06;
            const canopyPurlinDrop = canopySheetClear + (canopyPurlinH * 0.5) / cosCanopy; // ~0.063m
            const canopyRafterH = 0.08;
            const canopyRafterDrop = canopySheetClear + (canopyPurlinH + canopyRafterH * 0.5) / cosCanopy; // ~0.134m

            const leftLedgerZ = 10.2;
            const leftLedgerY = cYStart - (leftLedgerZ - cZStart) * cSlope;

            const rightLedgerZ = 9.7;
            const rightLedgerY = cYStart - (rightLedgerZ - cZStart) * cSlope;

            const leftCanopyXs = [3.40, 4.20, 5.00, 5.80];
            for (const rx of leftCanopyXs) {
                woodBeam(
                    [rx, leftLedgerY - canopyRafterDrop, leftLedgerZ],
                    [rx, cYEnd - canopyRafterDrop, cZEnd],
                    0.055, canopyRafterH, timberMainM
                );
            }

            const rightCanopyXs = [6.70, 7.50, 8.30, 9.10];
            for (const rx of rightCanopyXs) {
                woodBeam(
                    [rx, rightLedgerY - canopyRafterDrop, rightLedgerZ],
                    [rx, cYEnd - canopyRafterDrop, cZEnd],
                    0.055, canopyRafterH, timberMainM
                );
            }

            const pyBackRight = cYStart - (9.88 - cZStart) * cSlope - canopyPurlinDrop;
            woodBeam([6.25 + hT, pyBackRight, 9.88], [cX1, pyBackRight, 9.88], 0.05, canopyPurlinH, timberPurlinM);

            const fullCanopyPurlinsZ = [10.75, 11.65, 12.50];
            for (const pz of fullCanopyPurlinsZ) {
                const py = cYStart - (pz - cZStart) * cSlope - canopyPurlinDrop;
                woodBeam([cX0, py, pz], [cX1, py, pz], 0.05, canopyPurlinH, timberPurlinM);
            }
        })();

        // =========================================================================
        // 8. ATAP GELOMBANG ALA ASBES + NOK BUBUNGAN (LEMBARAN PENUTUP ATAP SAJA)
        // =========================================================================
        const roofs = new T.Group();
        scene.add(roofs);

        function addAsbesSlope(xMin, xMax, zStart, yStart, zEnd, yEnd, opts = {}) {
            const pitch = opts.pitch || 0.14;
            const amp = opts.amp || 0.019;
            const thick = opts.thick || 0.012;
            const ns = opts.segs || 4;

            const widthX = xMax - xMin;
            const dz = zEnd - zStart;
            const dy = yEnd - yStart;
            const slopeLen = Math.hypot(dz, dy);

            const ny = Math.abs(dz) / slopeLen;
            const nz = dz >= 0 ? -dy / slopeLen : dy / slopeLen;

            const nx = Math.max(12, Math.round(widthX / (pitch / 6)));
            const cols = nx + 1;
            const rows = ns + 1;
            const layerVerts = cols * rows;

            const positions = new Float32Array(layerVerts * 2 * 3);
            const uvs = new Float32Array(layerVerts * 2 * 2);

            for (let j = 0; j < rows; j++) {
                const vFrac = j / ns;
                const zBase = zStart + dz * vFrac;
                const yBase = yStart + dy * vFrac;
                const sDist = slopeLen * vFrac;

                for (let i = 0; i < cols; i++) {
                    const uFrac = i / nx;
                    const x = xMin + widthX * uFrac;
                    const wave = amp * Math.sin(((x - xMin) / pitch) * Math.PI * 2);

                    const idxTop = j * cols + i;
                    const idxBot = layerVerts + idxTop;

                    const offTop = wave + thick * 0.5;
                    const offBot = wave - thick * 0.5;

                    positions[idxTop * 3] = x;
                    positions[idxTop * 3 + 1] = yBase + offTop * ny;
                    positions[idxTop * 3 + 2] = zBase + offTop * nz;

                    positions[idxBot * 3] = x;
                    positions[idxBot * 3 + 1] = yBase + offBot * ny;
                    positions[idxBot * 3 + 2] = zBase + offBot * nz;

                    const u = (x - xMin) / 1.05;
                    const v = sDist / 1.80;
                    uvs[idxTop * 2] = u;
                    uvs[idxTop * 2 + 1] = v;
                    uvs[idxBot * 2] = u;
                    uvs[idxBot * 2 + 1] = v;
                }
            }

            const indices = [];
            const flipTop = dz < 0;

            for (let j = 0; j < ns; j++) {
                for (let i = 0; i < nx; i++) {
                    const a = j * cols + i;
                    const b = a + 1;
                    const c = a + cols;
                    const d = c + 1;
                    if (flipTop) {
                        indices.push(a, b, c, b, d, c);
                    } else {
                        indices.push(a, c, b, b, c, d);
                    }

                    const ba = layerVerts + a;
                    const bb = layerVerts + b;
                    const bc = layerVerts + c;
                    const bd = layerVerts + d;
                    if (flipTop) {
                        indices.push(ba, bc, bb, bb, bc, bd);
                    } else {
                        indices.push(ba, bb, bc, bb, bd, bc);
                    }
                }
            }

            for (let i = 0; i < nx; i++) {
                const t0 = i, t1 = i + 1;
                const b0 = layerVerts + i, b1 = layerVerts + i + 1;
                indices.push(t0, t1, b0, t1, b1, b0);

                const rOff = ns * cols;
                const rt0 = rOff + i, rt1 = rOff + i + 1;
                const rb0 = layerVerts + rt0, rb1 = layerVerts + rt1;
                indices.push(rt0, rb0, rt1, rt1, rb0, rb1);
            }

            for (let j = 0; j < ns; j++) {
                const lt0 = j * cols, lt1 = (j + 1) * cols;
                const lb0 = layerVerts + lt0, lb1 = layerVerts + lt1;
                indices.push(lt0, lb0, lt1, lt1, lb0, lb1);

                const rt0 = j * cols + nx, rt1 = (j + 1) * cols + nx;
                const rb0 = layerVerts + rt0, rb1 = layerVerts + rt1;
                indices.push(rt0, rt1, rb0, rt1, rb1, rb0);
            }

            const geo = new T.BufferGeometry();
            geo.setAttribute('position', new T.BufferAttribute(positions, 3));
            geo.setAttribute('uv', new T.BufferAttribute(uvs, 2));
            geo.setIndex(indices);
            geo.computeVertexNormals();

            const mesh = new T.Mesh(geo, asbesM);
            roofs.add(mesh);

            const borderPts = [];
            const pushEdgeLine = (idxA, idxB) => {
                borderPts.push(
                    positions[idxA * 3], positions[idxA * 3 + 1], positions[idxA * 3 + 2],
                    positions[idxB * 3], positions[idxB * 3 + 1], positions[idxB * 3 + 2]
                );
            };
            for (let i = 0; i < nx; i++) {
                pushEdgeLine(i, i + 1);
                pushEdgeLine(ns * cols + i, ns * cols + i + 1);
            }
            pushEdgeLine(0, ns * cols);
            pushEdgeLine(nx, ns * cols + nx);

            const lineGeo = new T.BufferGeometry();
            lineGeo.setAttribute('position', new T.Float32BufferAttribute(borderPts, 3));
            roofs.add(new T.LineSegments(lineGeo, edgeM));
        }

        function addAsbesRidge(xMin, xMax, zCenter, yPeak, slopeRatio) {
            const halfSpan = 0.23;
            const drop = halfSpan * slopeRatio;
            const t = 0.014;

            const s = new T.Shape();
            s.moveTo(-halfSpan, -drop);
            s.quadraticCurveTo(0, 0.055, halfSpan, -drop);
            s.lineTo(halfSpan, -drop - t);
            s.quadraticCurveTo(0, 0.055 - t, -halfSpan, -drop - t);
            s.closePath();

            const geo = new T.ExtrudeGeometry(s, {
                depth: xMax - xMin,
                bevelEnabled: false,
                curveSegments: 10
            });
            const mesh = new T.Mesh(geo, asbesRidgeM);
            mesh.rotation.y = Math.PI / 2;
            mesh.position.set(xMin, yPeak + 0.022, zCenter);
            roofs.add(mesh);

            const edge = new T.LineSegments(new T.EdgesGeometry(geo, 25), edgeM);
            edge.rotation.copy(mesh.rotation);
            edge.position.copy(mesh.position);
            roofs.add(edge);
        }

        (function buildMainAsbesSheets(x0, z0, x1, z1, rh, o) {
            const zMid = (z0 + z1) / 2;
            const halfRoofZ = (z1 - zMid) + o;
            const slopeRatio = rh / halfRoofZ;
            const yPeak = H + rh;

            addAsbesSlope(x0 - o, x1 + o, zMid, yPeak, z1 + o, H);
            addAsbesSlope(x0 - o, x1 + o, zMid, yPeak, z0 - o, H);
            addAsbesRidge(x0 - o - 0.015, x1 + o + 0.015, zMid, yPeak, slopeRatio);
        })(3.0, 0, 9.5, 10.2, 1.9, 0.4);

        addAsbesSlope(-0.4, 3.0 - hT, 3.4, H_LOW + 1.32, -0.4, H_LOW);
        addAsbesSlope(9.5 + hT, 11.4, 3.4, H_LOW + 1.32, -0.4, H_LOW);

        addAsbesSlope(3.0 - 0.4, 9.5 + 0.4, 9.7, 3.44, 12.6, 2.98);

        // =========================================================================
        // 9. GARIS UKUR PRESISI DENGAN KETERANGAN LENGKAP (PANJANG, LEBAR, TINGGI)
        // =========================================================================
        const dims = new T.Group();
        scene.add(dims);

        const dimDashM = new T.LineDashedMaterial({
            color: 0xdc2626,
            dashSize: 0.16,
            gapSize: 0.1
        });
        const dimTickM = new T.LineBasicMaterial({ color: 0xdc2626 });

        function dimLabel(txt, x, y, z, scale = 0.72) {
            const cv = document.createElement('canvas');
            const w = Math.max(280, txt.length * 22 + 56);
            cv.width = w;
            cv.height = 96;
            const g = cv.getContext('2d');
            g.fillStyle = 'rgba(255,255,255,0.94)';
            g.strokeStyle = '#dc2626';
            g.lineWidth = 5;
            g.beginPath();
            g.roundRect(12, 16, w - 24, 64, 14);
            g.fill();
            g.stroke();
            g.fillStyle = '#b91c1c';
            g.font = 'bold 31px system-ui, sans-serif';
            g.textAlign = 'center';
            g.textBaseline = 'middle';
            g.fillText(txt, w / 2, 50);
            const sp = new T.Sprite(new T.SpriteMaterial({
                map: new T.CanvasTexture(cv),
                depthTest: false
            }));
            sp.position.set(x, y, z);
            sp.scale.set(scale * (w / 116), scale * 0.82, 1);
            dims.add(sp);
        }

        function dimH(x1, z1, x2, z2, txt, tickDir = [0, 0], labelOffset = [0, 0], baseY = 0) {
            const y = baseY + 0.04, t = 0.16;
            const [tx, tz] = tickDir;

            const mainLine = new T.Line(
                new T.BufferGeometry().setFromPoints([
                    new T.Vector3(x1, y, z1),
                    new T.Vector3(x2, y, z2)
                ]),
                dimDashM
            );
            mainLine.computeLineDistances();
            dims.add(mainLine);

            const ticks = new T.LineSegments(
                new T.BufferGeometry().setFromPoints([
                    new T.Vector3(x1 - tx * t, y, z1 - tz * t), new T.Vector3(x1 + tx * t, y, z1 + tz * t),
                    new T.Vector3(x2 - tx * t, y, z2 - tz * t), new T.Vector3(x2 + tx * t, y, z2 + tz * t)
                ]),
                dimTickM
            );
            dims.add(ticks);

            dimLabel(txt, (x1 + x2) / 2 + labelOffset[0], baseY + 0.28, (z1 + z2) / 2 + labelOffset[1], 0.65);
        }

        function dimV(x, z, y1, y2, txt, offsetX = 0.35, offsetZ = 0) {
            const t = 0.18;
            const px = x + offsetX, pz = z + offsetZ;

            const vLine = new T.Line(
                new T.BufferGeometry().setFromPoints([
                    new T.Vector3(px, y1, pz),
                    new T.Vector3(px, y2, pz)
                ]),
                dimDashM
            );
            vLine.computeLineDistances();
            dims.add(vLine);

            const projLines = new T.LineSegments(
                new T.BufferGeometry().setFromPoints([
                    new T.Vector3(x, y1, z), new T.Vector3(px + t, y1, pz),
                    new T.Vector3(x, y2, z), new T.Vector3(px + t, y2, pz)
                ]),
                dimDashM
            );
            projLines.computeLineDistances();
            dims.add(projLines);

            const labelShiftX = offsetX >= 0 ? 0.68 : -0.68;
            dimLabel(txt, px + labelShiftX, (y1 + y2) / 2, pz, 0.72);
        }

        // Garis ukur horizontal (Panjang & Lebar ruangan / bangunan)
        dimH(0.0, -0.55, 8.0, -0.55, 'Panjang 8m', [0, 1], [0, -0.35], Y_DROP);
        dimH(8.0, -0.55, 11.0, -0.55, 'Lebar 3m', [0, 1], [0, -0.35], Y_DROP);

        dimH(-0.55, 0.0, -0.55, 3.0, 'Lebar 3m', [1, 0], [-0.55, 0], Y_DROP);
        dimH(11.55, 0.0, 11.55, 3.0, 'Lebar 3m', [1, 0], [0.55, 0], Y_DROP);
        dimH(0.0, 3.45, 3.0, 3.45, 'Lebar 3m', [0, 1], [0, 0.35], Y_DROP);
        dimH(9.5, 3.45, 11.0, 3.45, 'Lebar 1.5m', [0, 1], [0, 0.35], Y_DROP);
        dimH(3.0, 2.55, 9.5, 2.55, 'Panjang 6.5m', [0, 1], [0, -0.32], Y_DROP);

        dimH(2.45, 3.0, 2.45, 10.2, 'Panjang 7.2m', [1, 0], [-0.68, 0], 0);
        dimH(2.45, 10.2, 2.45, 12.2, 'Panjang 2m', [1, 0], [-0.62, 0], Y_DROP);
        dimH(10.05, 3.0, 10.05, 9.7, 'Panjang 6.7m', [1, 0], [0.68, 0], 0);
        dimH(10.05, 9.7, 10.05, 12.2, 'Panjang 2.5m', [1, 0], [0.68, 0], Y_DROP);
        dimH(3.0, 12.75, 9.5, 12.75, 'Lebar 6.5m', [0, 1], [0, 0.38], Y_DROP);

        dimH(5.9, 3.0, 5.9, 7.2, 'Panjang 4.2m', [1, 0], [-0.62, 0], 0);
        dimH(6.6, 6.0, 6.6, 7.2, 'Lebar 1.2m', [1, 0], [0.62, 0], 0);
        dimH(9.15, 3.0, 9.15, 6.0, 'Panjang 3m', [1, 0], [-0.55, 0], 0);
        dimH(9.15, 6.0, 9.15, 9.7, 'Panjang 3.7m', [1, 0], [-0.60, 0], 0);
        dimH(3.35, 7.2, 3.35, 10.2, 'Panjang 3m', [1, 0], [0.55, 0], 0);
        dimH(3.0, 10.55, 6.25, 10.55, 'Lebar 3.25m', [0, 1], [0, 0.32], Y_DROP);
        dimH(6.25, 10.05, 9.5, 10.05, 'Lebar 3.25m', [0, 1], [0, 0.32], Y_DROP);
        dimH(6.55, 9.7, 6.55, 10.2, 'Panjang 50cm', [1, 0], [0.62, 0], Y_DROP);

        // Garis ukur vertikal (Tinggi dinding, tiang, selisih lantai, dan bubungan)
        dimV(0.0, 0.0, Y_DROP, H_LOW, 'Tinggi 3m', -0.40, 0);
        dimV(11.0, 3.0, Y_DROP, H_LOW, 'Tinggi 3m', 0.45, 0);
        dimV(9.5, 6.0, 0, H, 'Tinggi 3.5m', 0.45, 0);
        dimV(3.0, 6.0, 0, H, 'Tinggi 3.5m', -0.45, 0);
        dimV(9.5, 5.1, 0, H + 1.9, 'Tinggi bubungan 5.4m', 1.15, 0);
        dimV(9.5, 12.2, Y_DROP, H_TERAS, 'Tinggi tiang 3m', 0.45, 0);
        dimV(3.0, 12.2, Y_DROP, 0, 'Turun lantai 10cm', -0.45, 0);

        // =========================================================================
        // 10. FITUR POV 360° TEPAT DI TENGAH TIAP RUANGAN
        // =========================================================================
        const povGroup = new T.Group();
        povGroup.visible = false;
        scene.add(povGroup);

        const ROOMS = [
            { name: 'Teras depan', x: 6.25, z: 10.95, yaw: Math.PI, floorY: Y_DROP },
            { name: 'Ruang tamu', x: 7.875, z: 7.85, yaw: Math.PI, floorY: 0 },
            { name: 'Kamar tidur tamu', x: 4.625, z: 8.70, yaw: 0, floorY: 0 },
            { name: 'Kamar tidur utama', x: 7.875, z: 4.50, yaw: -Math.PI / 2, floorY: 0 },
            { name: 'Ruang santai', x: 4.625, z: 5.10, yaw: Math.PI / 2, floorY: 0 },
            { name: 'Dapur & Perkakas', x: 4.00, z: 1.50, yaw: 0, floorY: Y_DROP },
            { name: 'Area belakang', x: 7.125, z: 1.75, yaw: -Math.PI / 2, floorY: Y_DROP },
            { name: 'Kamar mandi', x: 9.50, z: 0.75, yaw: -Math.PI / 2, floorY: Y_DROP }
        ];

        const povHotspots = [];
        const povNav = document.getElementById('povNav');

        function makeHotspotTexture(label) {
            const cv = document.createElement('canvas');
            cv.width = 320;
            cv.height = 140;
            const g = cv.getContext('2d');
            g.fillStyle = 'rgba(2, 132, 199, 0.94)';
            g.strokeStyle = '#ffffff';
            g.lineWidth = 6;
            g.beginPath();
            g.arc(160, 44, 32, 0, Math.PI * 2);
            g.fill();
            g.stroke();
            g.fillStyle = '#ffffff';
            g.font = 'bold 22px system-ui, sans-serif';
            g.textAlign = 'center';
            g.textBaseline = 'middle';
            g.fillText('360°', 160, 45);
            g.fillStyle = 'rgba(15, 23, 42, 0.88)';
            g.beginPath();
            g.roundRect(24, 86, 272, 42, 12);
            g.fill();
            g.fillStyle = '#ffffff';
            g.font = 'bold 22px system-ui, sans-serif';
            g.fillText(label, 160, 108);
            return new T.CanvasTexture(cv);
        }

        ROOMS.forEach((rm, idx) => {
            const ring = new T.Mesh(
                new T.RingGeometry(0.18, 0.34, 32),
                new T.MeshBasicMaterial({ color: 0x0284c7, side: T.DoubleSide })
            );
            ring.rotation.x = -Math.PI / 2;
            ring.position.set(rm.x, rm.floorY + 0.03, rm.z);
            ring.userData.roomIndex = idx;
            povGroup.add(ring);

            const sp = new T.Sprite(new T.SpriteMaterial({
                map: makeHotspotTexture(rm.name),
                depthTest: false
            }));
            sp.position.set(rm.x, rm.floorY + 1.35, rm.z);
            sp.scale.set(1.9, 0.83, 1);
            sp.userData.roomIndex = idx;
            povGroup.add(sp);
            povHotspots.push(ring, sp);

            const btn = document.createElement('button');
            btn.textContent = rm.name;
            btn.onclick = () => enterRoomPOV(idx);
            povNav.appendChild(btn);
        });

        let povMode = false;
        let activeRoom = -1;
        let povYaw = 0, povPitch = 0, povFov = 75;
        let th = 0.5, ph = 0.9, d = 24;
        const tg = new T.Vector3(5.5, 0, 6.1);

        function enterRoomPOV(idx) {
            const rm = ROOMS[idx];
            activeRoom = idx;
            povYaw = rm.yaw;
            povPitch = 0;
            povFov = 75;
            cam.fov = povFov;
            cam.updateProjectionMatrix();
            povHotspots.forEach(obj => {
                obj.visible = obj.userData.roomIndex !== idx;
            });
            [...povNav.children].forEach((b, i) => b.classList.toggle('active', i === idx));
            upd();
        }

        function togglePOV(forceState) {
            povMode = typeof forceState === 'boolean' ? forceState : !povMode;
            v.textContent = povMode ? 'Nonaktifkan POV' : 'Aktifkan POV';
            v.classList.toggle('active', povMode);
            povGroup.visible = povMode;
            povNav.style.display = povMode ? 'flex' : 'none';

            if (povMode) {
                activeRoom = -1;
                povHotspots.forEach(obj => obj.visible = true);
                [...povNav.children].forEach(b => b.classList.remove('active'));
                if (!roofs.visible) {
                    roofs.visible = true;
                    r.textContent = 'Hilangkan atap';
                }
            } else {
                activeRoom = -1;
                cam.fov = 50;
                cam.updateProjectionMatrix();
                th = 0.5; ph = 0.9; d = 24;
                upd();
            }
        }

        function upd() {
            if (povMode && activeRoom >= 0) {
                const rm = ROOMS[activeRoom];
                const eyeY = rm.floorY + 1.65;
                cam.position.set(rm.x, eyeY, rm.z);
                const lookX = rm.x + Math.sin(povYaw) * Math.cos(povPitch);
                const lookY = eyeY + Math.sin(povPitch);
                const lookZ = rm.z + Math.cos(povYaw) * Math.cos(povPitch);
                cam.lookAt(lookX, lookY, lookZ);
                return;
            }
            cam.position.set(
                tg.x + d * Math.sin(th) * Math.cos(ph),
                d * Math.sin(ph),
                tg.z + d * Math.cos(th) * Math.cos(ph)
            );
            cam.lookAt(tg);
        }
        upd();

        const el = ren.domElement, pts = new Map();
        const raycaster = new T.Raycaster();
        const pointerNDC = new T.Vector2();
        let pd = 0, downPos = [0, 0], moved = false;

        function handleHotspotClick(clientX, clientY) {
            if (!povMode) return;
            const rect = el.getBoundingClientRect();
            pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointerNDC, cam);
            const visibleTargets = povHotspots.filter(o => o.visible);
            const hits = raycaster.intersectObjects(visibleTargets, false);
            if (hits.length > 0) {
                enterRoomPOV(hits[0].object.userData.roomIndex);
            }
        }

        el.addEventListener('pointerdown', e => {
            el.setPointerCapture(e.pointerId);
            pts.set(e.pointerId, [e.clientX, e.clientY]);
            downPos = [e.clientX, e.clientY];
            moved = false;
        });
        el.addEventListener('pointerup', e => {
            pts.delete(e.pointerId);
            pd = 0;
            if (!moved && Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) < 8) {
                handleHotspotClick(e.clientX, e.clientY);
            }
        });
        el.addEventListener('pointermove', e => {
            if (!pts.has(e.pointerId)) return;
            const o = pts.get(e.pointerId);
            const dx = e.clientX - o[0];
            const dy = e.clientY - o[1];
            if (Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) > 6) moved = true;

            if (pts.size === 1) {
                if (povMode && activeRoom >= 0) {
                    povYaw += dx * 0.0055;
                    povPitch = Math.max(-1.45, Math.min(1.45, povPitch + dy * 0.0055));
                } else {
                    th -= dx * 0.007;
                    ph = Math.max(0.1, Math.min(1.55, ph + dy * 0.007));
                }
            }
            pts.set(e.pointerId, [e.clientX, e.clientY]);
            if (pts.size === 2) {
                const [a, b] = [...pts.values()], n = Math.hypot(a[0] - b[0], a[1] - b[1]);
                if (pd) {
                    if (povMode && activeRoom >= 0) {
                        povFov = Math.max(40, Math.min(100, povFov * pd / n));
                        cam.fov = povFov;
                        cam.updateProjectionMatrix();
                    } else {
                        d = Math.max(5, Math.min(50, d * pd / n));
                    }
                }
                pd = n;
            }
            upd();
        });
        el.addEventListener('wheel', e => {
            e.preventDefault();
            if (povMode && activeRoom >= 0) {
                povFov = Math.max(40, Math.min(100, povFov + e.deltaY * 0.03));
                cam.fov = povFov;
                cam.updateProjectionMatrix();
            } else {
                d = Math.max(5, Math.min(50, d * (1 + e.deltaY * 0.001)));
            }
            upd();
        }, { passive: false });

        p.onclick = () => {
            if (povMode) togglePOV(false);
            th = 0.5; ph = 0.9; d = 24; upd();
        };
        r.onclick = () => { roofs.visible = !roofs.visible; r.textContent = roofs.visible ? 'Hilangkan atap' : 'Aktifkan atap'; };
        k.onclick = () => { timberFrame.visible = !timberFrame.visible; k.textContent = timberFrame.visible ? 'Hilangkan rangka' : 'Aktifkan rangka'; };
        m.onclick = () => { dims.visible = !dims.visible; m.textContent = dims.visible ? 'Sembunyikan garis' : 'Tampilkan garis'; };
        v.onclick = () => togglePOV();

        addEventListener('resize', () => {
            cam.aspect = innerWidth / innerHeight;
            cam.updateProjectionMatrix();
            ren.setSize(innerWidth, innerHeight);
        });

        (function loop() {
            requestAnimationFrame(loop);
            ren.render(scene, cam);
        })();
    </script>
</body>

</html>
